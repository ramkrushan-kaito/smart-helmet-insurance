# Optional local PostgreSQL when it is not already installed.
# This project machine already has PostgreSQL on port 5432, so this
# compose file publishes 5433 to avoid taking over that server.
# Do not point production at this container.
services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-helmet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_helmet_insurance
    ports:
      - "5433:5432"
    volumes:
      - smart_helmet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_helmet_insurance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart_helmet_pg:
